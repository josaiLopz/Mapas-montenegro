<html>
  <head>
    <title>Escuelas de Mexico</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=default"></script>
    <!-- jsFiddle will insert css and js -->

    <link rel="stylesheet" type="text/css" href="stilos.css" />
    <script type="module" src="index.js"></script>


  </head>
  <body>
    <div class="hotel-search">
      <div id="findhotels">Buscador:</div>

      <div id="locationField">
        <input id="autocomplete" placeholder="Indica lugar" type="text" />
      </div>

      <div id="controls" style="display: none">
        <select id="country">
          <option value="mx">Mexico</option>
        </select>
      </div>
    </div>

    <div id="map"></div>

    <div id="listing">
      <table id="resultsTable">
        <tbody id="results"></tbody>
      </table>
    </div>

    <div style="display: none">
        <div id="info-content">
          <table>
            <tr id="iw-url-row" class="iw_table_row">
              <td id="iw-icon" class="iw_table_icon"></td>
              <td id="iw-url"></td>
            </tr>
            <tr id="iw-address-row" class="iw_table_row">
              <td class="iw_attribute_name">Direcci&oacute;n:</td>
              <td id="iw-address"></td>
            </tr>
            <tr id="iw-phone-row" class="iw_table_row">
              <td class="iw_attribute_name">Tel&eacute;fono:</td>
              <td id="iw-phone"></td>
            </tr>
            <tr id="iw-rating-row" class="iw_table_row">
              <td class="iw_attribute_name">Calificaci&oacute;n:</td>
              <td id="iw-rating"></td>
            </tr>
            <tr id="iw-website-row" class="iw_table_row">
              <td class="iw_attribute_name">Sitio web:</td>
              <td id="iw-website"></td>
            </tr>
            <tr id="iw-editable-row" class="iw_table_row">
            
              <td id="iw-editable" colspan="2" style='text-align:center'></td>
            </tr>
          </table>
        </div>
      </div>

    <!-- 
      The `defer` attribute causes the callback to execute after the full HTML
      document has been parsed. For non-blocking uses, avoiding race conditions,
      and consistent behavior across browsers, consider loading using Promises
      with https://www.npmjs.com/package/@googlemaps/js-api-loader.
      -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=key&callback=initMap&libraries=places&v=weekly"
      defer
    ></script>
    <script>
        function editar_info(place){
            alert("Ventana para agregar/editar info de la escuela  como por ejemplo distribuidor, publica/privada, prohibiciones, etc. con ID: "+place);

         }
</script>
  </body>
</html>

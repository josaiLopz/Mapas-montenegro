    <script>
        // Datos de ejemplo: 300 turnos
        const turnos = Array.from({ length: 300 }, (_, i) => ({
            folio: `Folio-${i + 1}`,
            turno: i + 1,
            estado: 'Pendiente' // Estado inicial
        }));
        // Función para crear las filas de la tabla
        function crearFilas() {
            const tablaBody = document.getElementById('tablaBody');
            tablaBody.innerHTML = '';
            const inicio = (paginaActual - 1) * itemsPorPagina;
            const fin = inicio + itemsPorPagina;
            const turnosPagina = turnos.slice(inicio, fin);
            turnosPagina.forEach(turno => {
                const fila = `
                    <tr id="${turno.folio}">
                        <td>${turno.folio}</td>
                        <td>
                            <select class="form-select status-select" data-folio="${turno.folio}">
                                <option value="Pendiente" class="pendiente">Pendiente</option>
                                <option value="Surtido" class="surtido">Surtido</option>
                                <option value="Validación y empaque" class="validacion">Validación y empaque</option>
                                <option value="Listo para embarcar" class="listo">Listo para embarcar</option>
                                <option value="Enviado" class="enviado">Enviado</option>
                                <option value="Cancelado" class="cancelado">Cancelado</option>
                            </select>
                        </td>
                        <td>${turno.turno}</td>
                    </tr>
                `;
                tablaBody.innerHTML += fila;
            });
        }
        // Configuración de la paginación
        const itemsPorPagina = 20;
        let paginaActual = 1;
        // Función para manejar el cambio de estado
        function cambiarEstado() {
            const select = this;
            const folio = select.dataset.folio;
            const nuevoEstado = select.value;
            // Actualizar el estado en los datos
            const turno = turnos.find(t => t.folio === folio);
            turno.estado = nuevoEstado;
            // Guardar en localStorage
            localStorage.setItem(folio, nuevoEstado);
            alert(`El estado del folio ${folio} ha sido cambiado a ${nuevoEstado}`);
        }
        // Función para crear los controles de paginación
        function crearControlesPaginacion() {
            const paginacion = document.getElementById('paginacion');
            const cantidadPaginas = Math.ceil(turnos.length / itemsPorPagina);
            paginacion.innerHTML = '';
            for (let i = 1; i <= cantidadPaginas; i++) {
                const botonPagina = document.createElement('li');
                botonPagina.classList.add('page-item');
                botonPagina.innerHTML = `<button class="page-link">${i}</button>`;
                botonPagina.addEventListener('click', () => {
                    paginaActual = i;
                    crearFilas();
                });
                paginacion.appendChild(botonPagina);
            }
        }
        // Al cargar la página, crear las filas de la tabla, configurar los controles de paginación y restaurar los estados desde localStorage si están disponibles
        document.addEventListener('DOMContentLoaded', () => {
            crearFilas();
            crearControlesPaginacion();
            const selectEstados = document.querySelectorAll('.form-select');
            selectEstados.forEach(select => {
                select.addEventListener('change', cambiarEstado);
                const estadoGuardado = localStorage.getItem(select.dataset.folio);
                if (estadoGuardado) {
                    select.value = estadoGuardado;
                }
            });
        });
        // Función para aplicar los filtros
        function aplicarFiltros() {
            const filtroFolio = document.getElementById('filtro_folio').value.trim().toLowerCase();
            const filtroEstado = document.getElementById('filtro_estado').value;

            const filas = document.querySelectorAll('#tablaBody tr');

            filas.forEach(fila => {
                const folio = fila.querySelector('td:first-child').textContent.trim().toLowerCase();
                const estado = fila.querySelector('select').value.toLowerCase();

                if ((filtroFolio === '' || folio.includes(filtroFolio)) && (filtroEstado === '' || estado === filtroEstado.toLowerCase())) {
                    fila.style.display = '';
                } else {
                    fila.style.display = 'none';
                }
            });
        }

        // Función para limpiar los filtros y mostrar todas las filas
        function limpiarFiltros() {
            document.getElementById('filtro_folio').value = '';
            document.getElementById('filtro_estado').value = '';
            const filas = document.querySelectorAll('#tablaBody tr');
            filas.forEach(fila => {
                fila.style.display = '';
            });
        }

    </script>
